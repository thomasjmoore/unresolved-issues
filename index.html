<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unresolved Issues</title>
<style>
  :root { --bg: #1a1716; --text: #e8e2d6; --link: #f3ead1; --muted: #9a9288; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; }
  .site-header { text-align: center; padding: 28px 16px 0; font-size: 1rem; font-weight: normal; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  main { flex: 1; display: grid; place-items: center; padding: 0 16px; text-align: center; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0.5rem 0; }
  a { color: var(--link); }
  a:hover { color: var(--muted); }
  .comic-logo { display: block; max-width: 440px; width: 90%; height: auto; margin: 0 auto; transition: opacity 0.2s ease; }
  .comic-logo:hover { opacity: 0.85; }
</style>
</head>
<body>
<p class="site-header">Unresolved Issues</p>
<main>
  <ul>
    <li><a href="/grimmskull/"><img class="comic-logo" src="/grimmskull/images/grimmskull_logo_transparent.png" alt="Grimmskull"></a></li>
  </ul>
</main>
</body>
</html>
